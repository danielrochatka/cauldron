name: distribution-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── architecture check ────────────────────────────────────────────────────
  arch-check:
    name: distribution-smoke / arch-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core (for arch_check imports)
        run: pip install -e '.[dev]'

      - name: Run architecture boundary checker
        run: python tools/arch_check.py

  # ── unit and package tests ────────────────────────────────────────────────
  tests:
    name: distribution-smoke / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all packages (editable)
        run: |
          # Build one args array: root+dev, all packages, all test fixtures —
          # single pip invocation so first-party cross-deps resolve in one pass.
          args=("-e" ".[dev]")
          for pkg in packages/*/; do
            [ -f "${pkg}pyproject.toml" ] || continue
            args+=("-e" "$pkg")
          done
          for fixture in tests/fixtures/*/; do
            [ -f "${fixture}pyproject.toml" ] || continue
            args+=("-e" "$fixture")
          done
          pip install "${args[@]}"

      - name: Core tests
        run: pytest tests/ -v

      - name: Package tests
        run: |
          for pkg in packages/*/; do
            [ -d "${pkg}tests" ] || continue
            [ -f "${pkg}pyproject.toml" ] || continue
            echo "--- pytest $pkg ---"
            (cd "$pkg" && pytest tests/ -v)
          done

  # ── wheel build ───────────────────────────────────────────────────────────
  # Builds all first-party wheels into a wheelhouse that subsequent jobs use.
  build-wheels:
    name: distribution-smoke / build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build root cauldron wheel
        run: python -m build --wheel --outdir wheelhouse .

      - name: Build package wheels
        run: |
          for pkg in packages/*/; do
            [ -f "${pkg}pyproject.toml" ] || continue
            echo "Building $pkg..."
            python -m build --wheel --outdir wheelhouse "$pkg"
          done

      - name: Generate wheelhouse manifest
        run: |
          SHA=$(git rev-parse HEAD)
          python3 tools/verify_wheels.py generate-manifest \
            --wheelhouse wheelhouse \
            --source-sha "$SHA"

      - name: List built wheels
        run: ls -lh wheelhouse/

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/
          retention-days: 1

  # ── wheel content validation ──────────────────────────────────────────────
  verify-wheels:
    name: distribution-smoke / verify-wheels
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Verify wheel contents
        run: |
          python3 tools/verify_wheels.py verify \
            --wheelhouse wheelhouse/ \
            --require-sha "$(git rev-parse HEAD)" \
            --repo-root .

  # ── clean-install verification ────────────────────────────────────────────
  clean-install:
    name: distribution-smoke / clean-install
    needs: [build-wheels, verify-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: sudo apt-get install -y curl

      - name: Download wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Resolve candidate SHA
        id: refs
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Clean-install candidate: $SHA"

      - name: Run clean-install verification
        env:
          VERIFY_ARTIFACT_DIR: ${{ github.workspace }}/verify-artifacts/clean-install
        run: |
          chmod +x cauldron-app/verify-update
          cauldron-app/verify-update \
            --wheelhouse "${{ github.workspace }}/wheelhouse" \
            "${{ steps.refs.outputs.sha }}"

      - name: Upload verification artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-clean-install-artifacts
          path: ${{ github.workspace }}/verify-artifacts/clean-install/
          if-no-files-found: ignore

  # ── upgrade-path verification ─────────────────────────────────────────────
  # This is the REQUIRED branch-protection job.
  # For PRs: upgrades from base branch SHA to the PR merge commit.
  # For pushes: upgrades from the previous release tag (or HEAD~1).
  upgrade:
    name: distribution-smoke / upgrade
    needs: [build-wheels, verify-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: sudo apt-get install -y curl

      - name: Download wheelhouse (for TO_REF)
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse/

      - name: Determine upgrade refs
        id: refs
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Start from the current working main — the commit the PR targets.
            # This guarantees FROM_REF includes every merged PR (including #72)
            # rather than an arbitrary ancestor.
            # Use git rev-parse HEAD (not github.event.pull_request.head.sha) so
            # TO_REF matches the actual merge commit the wheelhouse was built from.
            FROM="${{ github.event.pull_request.base.sha }}"
            TO=$(git rev-parse HEAD)
          else
            # Push to main: use the most recent release tag as FROM_REF.
            # Fall back to HEAD~1 when no tags exist yet.
            FROM=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
                   || git rev-parse HEAD~1)
            TO=$(git rev-parse HEAD)
          fi
          echo "from_ref=$FROM" >> "$GITHUB_OUTPUT"
          echo "to_ref=$TO"     >> "$GITHUB_OUTPUT"
          echo "Upgrade path: $FROM -> $TO"
          # Confirm FROM_REF is a real commit we can check out.
          git rev-parse --verify "${FROM}^{commit}" \
            || { echo "ERROR: FROM_REF $FROM does not resolve to a commit"; exit 1; }

      - name: Run upgrade-path verification
        env:
          VERIFY_ARTIFACT_DIR: ${{ github.workspace }}/verify-artifacts/upgrade
        run: |
          chmod +x cauldron-app/verify-update
          cauldron-app/verify-update \
            --wheelhouse "${{ github.workspace }}/wheelhouse" \
            --from-ref "${{ steps.refs.outputs.from_ref }}" \
            --to-ref   "${{ steps.refs.outputs.to_ref }}"

      - name: Upload verification artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-upgrade-artifacts
          path: ${{ github.workspace }}/verify-artifacts/upgrade/
          if-no-files-found: ignore

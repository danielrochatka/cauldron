[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauldron-ai-openai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cauldron>=0.1.0",
    "cauldron-ai>=0.1.0",
    "openai>=1.0",
]

[project.entry-points."cauldron.modules"]
"cauldron.ai.openai" = "cauldron_ai_openai.module:module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cauldron_ai_openai = []

[tool.pytest.ini_options]
pythonpath = ["src", "../../src", "../.."]
addopts = "-ra"
testpaths = ["tests"]

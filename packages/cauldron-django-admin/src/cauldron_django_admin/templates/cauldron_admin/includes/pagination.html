{% if page_obj.has_other_pages %}
<nav class="cui-pagination" aria-label="Pagination">
  <ul class="cui-pagination__list">
    {% if page_obj.has_previous %}
    <li><a href="?page={{ page_obj.previous_page_number }}" class="cui-pagination__link" rel="prev">Previous</a></li>
    {% endif %}
    <li><span class="cui-pagination__info">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li><a href="?page={{ page_obj.next_page_number }}" class="cui-pagination__link" rel="next">Next</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}

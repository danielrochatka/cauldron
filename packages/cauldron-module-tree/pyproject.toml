[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauldron-module-tree"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cauldron>=0.1.0",
    "cauldron-django-admin>=0.1.0",
]

[project.entry-points."cauldron.modules"]
"cauldron.module.tree" = "cauldron_module_tree.module:module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cauldron_module_tree = [
    "templates/**/*",
    "static/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../src", "../.."]
addopts = "-ra"

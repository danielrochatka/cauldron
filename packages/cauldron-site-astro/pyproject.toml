[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauldron-site-astro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cauldron>=0.1.0",
    "cauldron-content>=0.1.0",
    "cauldron-content-operations>=0.1.0",
    "django>=4.2",
]

[project.optional-dependencies]
ai = [
    "cauldron-ai>=0.1.0",
    "cauldron-ai-admin>=0.1.0",
    "cauldron-admin-content>=0.1.0",
]
test = [
    "cauldron-ai-admin>=0.1.0",
]

[project.entry-points."cauldron.modules"]
"cauldron.site.astro" = "cauldron_site_astro.module:module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../src", "../.."]
addopts = "-ra"
testpaths = ["tests"]

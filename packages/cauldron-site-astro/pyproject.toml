[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauldron-site-astro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cauldron>=0.1.0",
    "cauldron-content>=0.1.0",
    "cauldron-content-operations>=0.1.0",
    "django>=4.2",
]

[project.optional-dependencies]
ai = [
    "cauldron-ai>=0.1.0",
    "cauldron-ai-admin>=0.1.0",
]
test = [
    "cauldron-ai-admin>=0.1.0",
    # test_integration_flatfile.py wires a real ContentOperationService
    # backed by real FlatFile infrastructure. These are TEST-ONLY: nothing
    # in the site-astro runtime imports from cauldron_cms_flatfile or
    # cauldron_workspace_flatfile.
    "cauldron-cms-flatfile>=0.1.0",
    "cauldron-workspace-flatfile>=0.1.0",
]

[project.entry-points."cauldron.modules"]
"cauldron.site.astro" = "cauldron_site_astro.module:module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../src", "../.."]
addopts = "-ra"
testpaths = ["tests"]
